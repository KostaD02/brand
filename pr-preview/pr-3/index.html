<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>storybook - Storybook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    
    <style>
      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-regular.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-italic.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-bold.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: italic;
        font-weight: 700;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-bold-italic.woff2') format('woff2');
      }
    </style>

    <link href="./sb-manager/runtime.js" rel="modulepreload" />

    
    <link href="./sb-addons/storybook-core-server-presets-0/common-manager-bundle.js" rel="modulepreload" />
    
    <link href="./sb-addons/docs-1/manager-bundle.js" rel="modulepreload" />
    
    <link href="./sb-addons/storybook-2/manager-bundle.js" rel="modulepreload" />
      <style>:root{--kd-bg:#0a192f;--kd-bg-alpha:rgba(10, 25, 47, 0.8509803922);--kd-bg-surface:#0d2035;--kd-bg-elevated:#112240;--kd-bg-elevated-hover:#233554;--kd-border:#233554;--kd-border-strong:#495670;--kd-border-focus:#64ffda;--kd-text-primary:#ccd6f6;--kd-text-secondary:#a8b2d1;--kd-text-muted:#8892b0;--kd-text-bright:#e6f1ff;--kd-text-inverse:#0a192f;--kd-accent:#64ffda;--kd-accent-soft:rgba(100, 255, 218, 0.08);--kd-accent-line:rgba(100, 255, 218, 0.3);--kd-success:var(--kd-accent);--kd-warning:#ffd166;--kd-warning-soft:rgba(255, 209, 102, 0.1);--kd-danger:#ff6363;--kd-danger-soft:rgba(255, 99, 99, 0.1);--kd-selection-bg:#233554;--kd-selection-fg:#64ffda;--kd-scrollbar-thumb:#495670;--kd-code-bg:#011627;--kd-code-fg:#d6deeb;--kd-code-inline-fg:#addb67;--kd-shadow-sm:0 10px 30px -15px rgba(2, 12, 27, 0.5);--kd-shadow-md:0 10px 30px -15px rgba(2, 12, 27, 0.7);--kd-shadow-lg:0 20px 30px -15px rgba(2, 12, 27, 0.7);--kd-shadow-side:-10px 0 30px -15px rgba(2, 12, 27, 0.7);}</style> 

    <style>
      #storybook-root[hidden] {
        display: none !important;
      }
    </style>

    
  </head>
  <body>
    <div id="root"></div>

    
    <script>
      
        
          window['FEATURES'] = {
  "actions": true,
  "argTypeTargetsV7": true,
  "babelRemoveBugfixes": false,
  "backgrounds": true,
  "changeDetection": true,
  "componentsManifest": false,
  "controls": true,
  "disallowImplicitActionsInRenderV8": true,
  "highlight": true,
  "interactions": true,
  "legacyDecoratorFileOrder": false,
  "measure": true,
  "outline": true,
  "menuOnboardingChecklist": true,
  "sidebarOnboardingChecklist": true,
  "viewport": true
};
        
      
        
          window['REFS'] = {};
        
      
        
          window['LOGLEVEL'] = "info";
        
      
        
          window['DOCS_OPTIONS'] = {
  "defaultName": "Docs"
};
        
      
        
          window['CONFIG_TYPE'] = "PRODUCTION";
        
      
        
          window['DOCGEN_STORY_PREPARED'] = false;
        
      
        
      
        
      
        
          window['TAGS_OPTIONS'] = {};
        
      
        
          window['STORYBOOK_BUILDER'] = "vite";
        
      
        
          window['STORYBOOK_FRAMEWORK'] = "html-vite";
        
      
        
          window['STORYBOOK_RENDERER'] = "html";
        
      
        
      
    </script>
    

    <script type="module">
      import './sb-manager/globals-runtime.js';

      
        import './sb-addons/storybook-core-server-presets-0/common-manager-bundle.js';
      
        import './sb-addons/docs-1/manager-bundle.js';
      
        import './sb-addons/storybook-2/manager-bundle.js';
      

      import './sb-manager/runtime.js';
    </script>
  </body>
</html>
