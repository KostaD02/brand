name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hub:
    permissions:
      contents: read
      pull-requests: write
    uses: KostaD02/ci/.github/workflows/ci.yml@v1
    with:
      test: ""
      build: pnpm run build
      artifact-prefix: kostad-brand
      size-table: css
      footer: |
        ## 🔎 PR preview

        **[Storybook for this branch](https://kostad02.github.io/brand/pr-preview/pr-${{ github.event.pull_request.number }}/)**

        Rebuilt on every push, removed when the PR closes.

  storybook:
    needs: [hub]
    permissions:
      contents: write
      pull-requests: write
    uses: KostaD02/ci/.github/workflows/pages-preview.yml@v1
    with:
      name: Storybook
      run: pnpm run docs:build
      folder: storybook-static
      base-path-env: STORYBOOK_BASE
